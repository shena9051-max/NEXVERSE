<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>NEXVERSE V0.2</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#07090f;color:#f7f8fb;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
:root{--a:#d9ff46;--m:#858c9f}
.shell{max-width:430px;height:100vh;margin:auto;background:#0b0e15;position:relative;overflow:hidden}
.top{height:68px;padding:12px 15px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #242936;background:#0a0d14;position:absolute;top:0;left:0;right:0;z-index:20}
.brand{font-weight:900;letter-spacing:.08em}.sub{font-size:6px;letter-spacing:.2em;color:#798095}.bal{border:1px solid #2a3040;padding:9px 11px;border-radius:12px;font-size:10px;font-weight:800}.bal b{color:var(--a)}
.feed{position:absolute;top:68px;bottom:68px;left:0;right:0;overflow-y:auto;scroll-snap-type:y mandatory;background:#000}
.post{height:100%;position:relative;scroll-snap-align:start;overflow:hidden;background:#111}
.post video{width:100%;height:100%;object-fit:cover;background:#000}
.shade{position:absolute;inset:0;background:linear-gradient(transparent 42%,rgba(0,0,0,.72) 100%);pointer-events:none}
.badge{position:absolute;top:18px;left:16px;border:1px solid #ffffff44;border-radius:99px;padding:6px 9px;font-size:8px;font-weight:900;background:#0005}
.views{position:absolute;top:18px;right:16px;border:1px solid #ffffff44;border-radius:99px;padding:6px 9px;font-size:9px;font-weight:900;background:#0005;backdrop-filter:blur(4px)}
.meta{position:absolute;left:16px;right:72px;bottom:22px;text-shadow:0 2px 12px #000}
.meta small{font-weight:800}.meta h2{font-size:22px;line-height:1.03;margin:7px 0}.meta p{font-size:11px;color:#ffffffcc;line-height:1.45;margin:0 0 10px}
.enter{background:var(--a);color:#080b10;border:0;border-radius:11px;padding:10px 12px;font-size:10px;font-weight:900}
.actions{position:absolute;right:10px;bottom:122px;display:grid;gap:12px}
.actions button{width:50px;height:50px;border:0;border-radius:50%;background:#0007;color:#fff;font-size:9px;backdrop-filter:blur(4px)}
.actions .own{color:var(--a)}
.nav{height:68px;position:absolute;bottom:0;left:0;right:0;border-top:1px solid #252a38;background:#0a0d14;display:grid;grid-template-columns:repeat(5,1fr);z-index:20}
.nav button{border:0;background:none;color:#72798b;font-size:8px;font-weight:900}.nav button.active{color:var(--a)}
.placeholder{height:100%;display:grid;place-items:center;padding:30px;text-align:center;background:linear-gradient(145deg,#161928,#43235c,#b64b6d)}
.placeholder div{max-width:280px}.placeholder h2{margin:8px 0}.placeholder p{font-size:11px;color:#ddd;line-height:1.5}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div><div class="brand">NEXVERSE</div><div class="sub">AI ENTERTAINMENT NETWORK</div></div>
    <div class="bal"><b>◈</b> 1,250 NEX</div>
  </header>

  <main class="feed" id="feed">
    <section class="post">
      <video src="video1.mp4" playsinline muted loop preload="metadata"></video>
      <div class="shade"></div>
      <div class="badge">AI VIDEO</div>
      <div class="views" aria-label="再生回数">▶ <span class="view-count">0</span></div>
      <div class="actions">
        <button class="like">♡<br><span>0</span></button>
        <button>◯<br>0</button>
        <button class="own">◇<br>OWN</button>
      </div>
      <div class="meta">
        <small>@creator_one ✓</small>
        <h2>AI World #001</h2>
        <p>最初のNEXVERSE投稿。縦スワイプで次の動画へ。</p>
        <button class="enter">🎮 ENTER WORLD ↗</button>
      </div>
    </section>

    <section class="post">
      <video src="video2.mp4" playsinline muted loop preload="metadata"></video>
      <div class="shade"></div>
      <div class="badge">AI VIDEO</div>
      <div class="views" aria-label="再生回数">▶ <span class="view-count">0</span></div>
      <div class="actions">
        <button class="like">♡<br><span>0</span></button>
        <button>◯<br>0</button>
        <button class="own">◇<br>OWN</button>
      </div>
      <div class="meta">
        <small>@creator_two ✓</small>
        <h2>AI World #002</h2>
        <p>2本目のAIショート。あとで投稿システムに置き換える。</p>
        <button class="enter">🎮 ENTER WORLD ↗</button>
      </div>
    </section>

    <section class="post">
      <div class="placeholder">
        <div>
          <div style="color:#d9ff46;font-size:34px">✦</div>
          <h2>NEXVERSE</h2>
          <p>ここまで来たら縦スワイプは成功。次は「投稿・いいね・再生数」を本物にしていく。</p>
        </div>
      </div>
    </section>
  </main>

  <nav class="nav">
    <button class="active">WATCH</button>
    <button>PLAY</button>
    <button>MARKET</button>
    <button>CREATE</button>
    <button>PROFILE</button>
  </nav>
</div>

<script>
const feed = document.getElementById('feed');
const posts = [...document.querySelectorAll('.post')];
const observer = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    const v = entry.target.querySelector('video');
    if(!v) return;
    const isVisible = entry.isIntersecting && entry.intersectionRatio >= 0.65;
    if(isVisible){
      if(entry.target.dataset.isViewing !== 'true'){
        const count = entry.target.querySelector('.view-count');
        count.textContent = Number(count.textContent) + 1;
        entry.target.dataset.isViewing = 'true';
      }
      document.querySelectorAll('video').forEach(x => { if(x !== v) x.pause(); });
      v.play().catch(()=>{});
    }else{
      entry.target.dataset.isViewing = 'false';
      v.pause();
    }
  });
},{threshold:[0,.65,1]});
posts.forEach(p=>observer.observe(p));

document.querySelectorAll('.like').forEach(btn=>{
  let liked=false;
  btn.onclick=()=>{
    liked=!liked;
    btn.style.color=liked?'#ff6b93':'#fff';
    btn.querySelector('span').textContent=liked?'1':'0';
  };
});
</script>
</body>
</html>
